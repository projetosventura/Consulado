services:
  postgres:
    image: postgres:16-alpine
    container_name: consulado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consulado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consulado}
      POSTGRES_DB: ${POSTGRES_DB:-rifas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consulado} -d ${POSTGRES_DB:-rifas}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: consulado-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-consulado}:${POSTGRES_PASSWORD:-consulado}@postgres:5432/${POSTGRES_DB:-rifas}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: consulado-web
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
